name: Package release

# Reusable release for every basalt-js package. The caller's workflow file must be named
# publish.yml: npm Trusted Publishing is registered against that file name per repository.
#
#   jobs:
#     release:
#       uses: basalt-js/ci/.github/workflows/package-release.yml@main
#       permissions:
#         contents: write
#         id-token: write
#       with:
#         release-type: ${{ inputs.release-type }}
on:
  workflow_call:
    inputs:
      release-type:
        description: patch, minor, major or prerelease.
        type: string
        required: true
      release-command:
        description: Command that runs basalt-release (the ci repo releases itself with its local script).
        type: string
        default: bunx basalt-release
      bun-version:
        description: Bun version to install.
        type: string
        default: "1.4.4"
      node-version:
        description: Node version that provides npm for publishing (Trusted Publishing needs a recent npm).
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag and create the GitHub release
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags are the version source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Configure git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: ${{ inputs.release-command }} "$RELEASE_TYPE"
